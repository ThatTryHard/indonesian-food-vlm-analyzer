name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-ci.txt
      - run: ruff check src scripts tests
      - run: pytest -q
      - run: python scripts/generate_notebooks.py
      - run: git diff --exit-code -- notebooks
      - run: python scripts/validate_notebooks.py
      - run: python scripts/publish_results.py --metrics artifacts/metrics.json --output /tmp/RESULTS.md
      - run: diff -u reports/RESULTS.md /tmp/RESULTS.md
